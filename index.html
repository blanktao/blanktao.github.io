<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blank</title>
  <meta name="description" content="Blank 的个人主页">
  <link rel="icon" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top">Blank</a>
    <nav class="site-nav">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深浅色">
        <span class="theme-toggle-icon"></span>
      </button>
    </nav>
  </header>

  <main id="top">
    <section class="hero reveal">
      <div class="avatar-wrap">
        <img class="avatar" src="images/profile.png" alt="Blank">
      </div>
      <h1 class="hero-name">Blank</h1>
      <div class="hero-actions">
        <a class="btn btn-primary" href="mailto:blanktao@gmail.com">联系我</a>
        <a class="btn btn-ghost" href="https://github.com/blanktao" target="_blank" rel="noopener">GitHub</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="copyright">© <span id="year"></span> Blank</p>
    <div class="social">
      <a href="mailto:blanktao@gmail.com">Email</a>
      <a href="https://github.com/blanktao" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
